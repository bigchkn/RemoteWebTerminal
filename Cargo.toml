[package]
name = "remote-web-daemon"
version = "0.1.0"
edition = "2021"
description = "Localhost web daemon for managing tmux terminal sessions"
license = "MIT"

[[bin]]
name = "remote-web-daemon"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
clap = { version = "4", features = ["derive", "env"] }
include_dir = "0.7"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = "0.5"
